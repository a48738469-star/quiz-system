<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Online Quiz Management System</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h2>Quiz Management System</h2>
            <div id="userHeader" class="hidden">
                <span id="welcomeMsg" style="margin-right: 15px; font-weight: 600;"></span>
                <button class="logout-btn" onclick="logout()">Logout</button>
            </div>
        </header>

        <div id="loginView" class="auth-box">
            <h3>Login</h3>
            <p style="margin-bottom: 16px; font-size: 13px; color: #64748b;">
                Demo Credentials:<br>
                Admin: <b>admin / admin123</b><br>
                Student: <b>student1 / student123</b>
            </p>
            <div class="form-group">
                <label>Username</label>
                <input type="text" id="username" placeholder="Enter username">
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="password" placeholder="Enter password">
            </div>
            <button style="width: 100%;" onclick="login()">Sign In</button>
            <p id="loginError" style="color: #dc2626; margin-top: 10px; font-size: 14px;"></p>
        </div>

        <div id="studentView" class="hidden">
            <div style="display: flex; gap: 10px; margin-bottom: 20px;">
                <button onclick="showTakeQuiz()">Take Quiz</button>
                <button onclick="loadResults()" style="background: #475569;">My Results</button>
            </div>

            <div id="quizContainer">
                <h3>Live Multiple-Choice Questions</h3>
                <form id="quizForm" style="margin-top: 16px;"></form>
                <button id="submitBtn" onclick="submitQuiz()" style="display:none; margin-top: 10px;">Submit Quiz</button>
            </div>

            <div id="scoreSummary" class="card hidden" style="text-align: center;">
                <h3>Quiz Completed!</h3>
                <h1 id="scoreDisplay" style="color: #2563eb; margin: 12px 0;"></h1>
                <p id="scoreDetails"></p>
            </div>
        </div>

        <div id="adminView" class="hidden">
            <h3>Admin Portal</h3>
            <div style="display: flex; gap: 10px; margin: 15px 0;">
                <button onclick="toggleAdminTab('addQ')">Add New MCQ</button>
                <button onclick="toggleAdminTab('results')" style="background: #475569;">All Student Results</button>
            </div>

            <div id="adminAddQ" class="card">
                <h4>Create Multiple Choice Question</h4>
                <div class="form-group" style="margin-top: 10px;">
                    <label>Question Text</label>
                    <input type="text" id="newQuestion" placeholder="e.g., What is Express.js?">
                </div>
                <div class="form-group">
                    <label>Option A</label>
                    <input type="text" id="optA" placeholder="Option A">
                </div>
                <div class="form-group">
                    <label>Option B</label>
                    <input type="text" id="optB" placeholder="Option B">
                </div>
                <div class="form-group">
                    <label>Option C</label>
                    <input type="text" id="optC" placeholder="Option C">
                </div>
                <div class="form-group">
                    <label>Option D</label>
                    <input type="text" id="optD" placeholder="Option D">
                </div>
                <div class="form-group">
                    <label>Correct Option</label>
                    <select id="correctOpt">
                        <option value="A">Option A</option>
                        <option value="B">Option B</option>
                        <option value="C">Option C</option>
                        <option value="D">Option D</option>
                    </select>
                </div>
                <button onclick="addQuestion()">Save Question</button>
            </div>
        </div>

        <div id="resultsTableContainer" class="hidden">
            <h3 id="tableTitle" style="margin-top: 20px;">Results Dashboard</h3>
            <table>
                <thead>
                    <tr id="tableHeader"></tr>
                </thead>
                <tbody id="resultsBody"></tbody>
            </table>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
